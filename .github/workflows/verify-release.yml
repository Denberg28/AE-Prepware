name: Verify and package candidate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check candidate tag matches source version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != v0.1.0-rc.1 ]]; then exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test tests/*.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && node tests/browser.cjs | tee artifacts/browser.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q | tee artifacts/pytest.txt
      - run: AE_PYTHON=python node tests/cohort-browser.cjs | tee artifacts/cohort-browser.txt
      - run: pip-audit -r backend/requirements.lock --format json > artifacts/dependency-audit.json
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lint --no-daemon
      - run: python scripts/package_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: AE-Prepware-0.1.0-rc.1-Test-Candidate
          path: |
            artifacts/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
  prerelease:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AE-Prepware-0.1.0-rc.1-Test-Candidate
          path: release-artifacts
      - name: Publish verified test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-rc.1 --target "$GITHUB_SHA" --prerelease --title "AE Prepware v0.1.0-rc.1 · Test candidate" --notes-file docs/RELEASE_NOTES.md release-artifacts/artifacts/*.apk release-artifacts/artifacts/SHA256SUMS.txt release-artifacts/artifacts/APK-VERIFICATION.txt release-artifacts/artifacts/release-manifest.json

