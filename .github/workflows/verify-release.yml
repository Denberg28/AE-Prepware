name: Verify and publish signed candidate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      prepared: ${{ steps.signed.outputs.prepared }}
    steps:
      - uses: actions/checkout@v4
      - name: Read candidate version
        id: version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test tests/*.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && node tests/browser.cjs | tee artifacts/browser.txt
      - run: node tests/sources-browser.cjs | tee artifacts/sources-browser.txt
      - run: node tests/private-bank-browser.cjs | tee artifacts/private-bank-browser.txt
      - run: node tests/shell-browser.cjs | tee artifacts/shell-browser.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock -r scripts/requirements-authoring.lock
      - run: python -m pytest -q | tee artifacts/pytest.txt
      - run: AE_PYTHON=python node tests/cohort-browser.cjs | tee artifacts/cohort-browser.txt
      - run: pip-audit -r backend/requirements.lock --format json > artifacts/dependency-audit.json
      - run: pip-audit -r scripts/requirements-authoring.lock --format json > artifacts/authoring-audit.json
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lint --no-daemon
      - name: Verify prepared permanent-signer APK
        id: signed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -f "release-candidates/$VERSION/AE-Prepware-$VERSION-Signed-Candidate.apk" ]]; then
            python scripts/package_candidate.py --verify | tee artifacts/signed-verification.txt
            echo 'prepared=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Source checks only; permanent-signer APK has not been prepared. Publication is blocked.'
            echo 'prepared=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AE-Prepware-${{ steps.version.outputs.version }}-Verification
          path: |
            artifacts/
            release-candidates/${{ steps.version.outputs.version }}/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
  prerelease:
    if: needs.verify.outputs.prepared == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AE-Prepware-${{ needs.verify.outputs.version }}-Verification
          path: release-artifacts
      - name: Publish verified signed test candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Existing release preserved; published versions are never overwritten.'
            exit 0
          fi
          PREPARED="release-artifacts/release-candidates/$VERSION"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --title "AE Prepware v$VERSION · Signed test candidate" --notes-file docs/RELEASE_NOTES.md "$PREPARED/AE-Prepware-$VERSION-Signed-Candidate.apk" "$PREPARED/SHA256SUMS.txt" "$PREPARED/APK-VERIFICATION.txt" "$PREPARED/release-manifest.json" "$PREPARED/AE-Prepware-release-certificate.pem"
