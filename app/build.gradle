plugins { id 'com.android.application' }
def candidate = new groovy.json.JsonSlurper().parse(rootProject.file('release.json'))
android {
    namespace 'ph.diversify.aeprepware'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'ph.diversify.aeprepware'; minSdk 26; targetSdk 35; versionCode Integer.parseInt((project.findProperty('verificationVersionCode') ?: candidate.versionCode).toString()); versionName candidate.version }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
// A private authoring build may overlay a locally supplied bank. Public builds
// use only committed original content; the publication verifier rejects private banks.
def privateBankFile = project.findProperty('privateBankFile')
if (privateBankFile) {
    def privateAssets = layout.buildDirectory.dir('private-assets')
    def preparePrivateAssets = tasks.register('preparePrivateAssets', Sync) {
        from('src/main/assets') { exclude 'bank.json' }
        from(rootProject.file(privateBankFile)) { rename { 'bank.json' } }
        into(privateAssets)
        doFirst {
            if (!rootProject.file(privateBankFile).isFile()) throw new GradleException('Private bank file is missing')
        }
    }
    android.sourceSets.main.assets.setSrcDirs([privateAssets])
    tasks.named('preBuild').configure { dependsOn preparePrivateAssets }
}
